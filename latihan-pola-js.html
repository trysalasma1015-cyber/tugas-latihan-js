    <script>

        console.log("********");
        console.log("********");
        console.log("********");
        console.log("********");

        console.log("*      *");
        console.log("*      *");

        console.log("   * *");
        console.log("  *   *");
        console.log(" *     *");
        console.log("*********");
    </script>
</body>
