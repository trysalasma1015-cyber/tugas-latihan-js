<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Percabangan</title>
</head>
<body>
    <a href="/tugas1-js/" style="display:inline-block;margin:15px;background:#38b6ff;color:white;padding:10px 18px;text-decoration:none;border-radius:10px;font-weight:bold;">← Kembali ke Menu</a>
    <h2>Latihan Percabangan - Soal 1 & 2</h2>
    <p>Silakan buka <b>Inspect Element -> Console</b></p>

    <script>
        console.log("Soal 1: Penilaian");
        var nilai = 80;
        if (nilai >= 75) {
            console.log("Lulus");
        } else {
            console.log("Remedial");
        }

        console.log(" ");
        console.log("Soal 2: Kode Peran");
        function cariRole(kodePeran) {
            switch (kodePeran) {
                case "A":
                    console.log("Admin");
                    break;
                case "U":
                    console.log("User");
                    break;
                default:
                    console.log("Guest");
                    break;
            }
        }

        cariRole("A");
        cariRole("U");
    </script>
</body>
</html>
