<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Function & Logika</title>
</head>
<body>
   <a href="/tugas1-js/" style="display:inline-block;margin:15px;background:#38b6ff;color:white;padding:10px 18px;text-decoration:none;border-radius:10px;font-weight:bold;">← Kembali ke Menu</a>
    <h2>Latihan Function & Logika - 3 Soal</h2>
    <p>Silakan buka <b>Inspect Element -> Console</b></p>
    <script>
        console.log("Soal 1: FizzBuzz");
        for (var i = 1; i <= 15; i++) {
            if (i % 15 == 0) {
                console.log("FizzBuzz");
            } else if (i % 3 == 0) {
                console.log("Fizz");
            } else if (i % 5 == 0) {
                console.log("Buzz");
            } else {
                console.log(i);
            }
        }
        console.log(" ");
        console.log("Soal 2: Genap Ganjil");
        function cekGenapGanjil(angka) {
            if (angka % 2 == 0) {
                console.log(angka + " adalah Genap");
            } else {
                console.log(angka + " adalah Ganjil");
            }
        }
        cekGenapGanjil(4);
        cekGenapGanjil(7);
        console.log(" ");
        console.log("Soal 3: Balik String");
        function balikString(teks) {
            var hasil = "";
            for (var i = teks.length - 1; i >= 0; i--) {
                hasil += teks[i];
            }
            console.log(hasil);
        }
        balikString("halo");
    </script>
</body>
</html>
